<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pro Gym: Estilo Boyka</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"Boyka Gym","short_name":"Boyka","start_url":"./index.html","display":"standalone","background_color":"#000","theme_color":"#000"}'>
    <style>
        :root { --bg: #000; --card: #0a0a0a; --accent: #38bdf8; --text: #fff; --done: #22c55e; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .app { max-width: 450px; margin: auto; }
        .progress-bar { height: 4px; background: #222; margin-bottom: 20px; border-radius: 2px; }
        #progress-fill { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222; margin-bottom: 20px; }
        .exercise { padding: 15px 0; border-bottom: 1px solid #222; display: flex; align-items: center; cursor: pointer; }
        .exercise.done { opacity: 0.4; }
        .btn-rest { background: #111; color: var(--accent); border: 1px solid var(--accent); padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; margin-left: 10px; }
        .btn-nav { background: #111; border: 1px solid #333; color: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div class="nav-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <button class="btn-nav" onclick="changeDay(-1)">←</button>
            <div id="day-name" style="font-weight:900; color:var(--accent); font-size: 1.1rem;"></div>
            <button class="btn-nav" onclick="changeDay(1)">→</button>
        </div>
        <div id="routine-container"></div>
        <button onclick="resetWeek()" style="background:none; border:none; color:#444; width:100%; font-size:0.7rem; margin-top:10px;">Resetear semana</button>
    </div>

    <script>
        const rutinas = { 
            1: { name: "LUNES: PECHO Y HOMBROS", ex: [{n:"Press Banca", eq:"Barra", s:"4x8 Pesado"}, {n:"Press Inclinado", eq:"Mancuernas", s:"4x10"}, {n:"Aperturas Polea", eq:"Cable", s:"3x12"}, {n:"Press Militar", eq:"Barra", s:"4x8"}, {n:"Elev. Laterales", eq:"Mancuernas", s:"4x15"}, {n:"Lagartijas Explosivas", eq:"Suelo", s:"Al fallo"}]}, 
            2: { name: "MARTES: ESPALDA Y BÍCEP", ex: [{n:"Dominadas", eq:"Barra", s:"4 al fallo"}, {n:"Remo con Barra", eq:"Barra", s:"4x8-10"}, {n:"Remo al Mentón", eq:"Barra", s:"3x12"}, {n:"Curl Barra Z", eq:"Barra Z", s:"4x10"}, {n:"Curl Martillo", eq:"Mancuernas", s:"3x12"}]},
            3: { name: "MIÉRCOLES: PIERNA Y AGILIDAD", ex: [{n:"Sentadilla Libre", eq:"Barra", s:"4x8"}, {n:"Prensa de Piernas", eq:"Máquina", s:"3x12"}, {n:"Zancadas", eq:"Mancuernas", s:"3x20 pasos"}, {n:"Saltos al Cajón", eq:"Cajón", s:"4x10"}, {n:"Elev. Piernas", eq:"Colgado", s:"4x15"}]},
            4: { name: "JUEVES: TORSO DENSIDAD", ex: [{n:"Fondos Paralelas", eq:"Peso corporal", s:"4 al fallo"}, {n:"Press Plano", eq:"Mancuernas", s:"3x10"}, {n:"Remo 1 mano", eq:"Mancuerna", s:"3x10"}, {n:"Pájaros (Hombro post)", eq:"Mancuernas", s:"4x15"}, {n:"Planchas dinámicas", eq:"Suelo", s:"3x1 min"}]},
            5: { name: "VIERNES: DÍA BOYKA (EXPLOSIVIDAD)", ex: [{n:"Burpees", eq:"Suelo", s:"5x15"}, {n:"Flexiones Diamante", eq:"Suelo", s:"4 al fallo"}, {n:"Sentadillas con Salto", eq:"Peso corporal", s:"4x15"}, {n:"Sombra (Boxing)", eq:"Fluidez", s:"10 rounds x 2 min"}]}
        };

        let currentDay = new Date().getDay() || 1; if(currentDay > 5) currentDay = 1;

        function updateProgress() {
            const total = document.querySelectorAll('.exercise').length;
            const done = document.querySelectorAll('.exercise.done').length;
            document.getElementById('progress-fill').style.width = (done/total)*100 + "%";
        }

        function toggleExercise(el, id) { 
            el.classList.toggle('done'); 
            localStorage.setItem(id, el.classList.contains('done')); 
            updateProgress();
        }

        function restTimer() {
            let s = 60;
            const b = event.target;
            const i = setInterval(() => {
                b.innerText = --s + "s";
                if(s<=0) { clearInterval(i); b.innerText = "60s"; }
            }, 1000);
        }

        function resetWeek() { if(confirm("¿Borrar todo el progreso semanal?")) { localStorage.clear(); render(); } }

        function render() {
            const d = rutinas[currentDay]; document.getElementById('day-name').innerText = d.name;
            const container = document.getElementById('routine-container'); container.innerHTML = "";
            d.ex.forEach((e, idx) => {
                const id = `d${currentDay}-e${idx}`;
                container.innerHTML += `<div class="card exercise ${localStorage.getItem(id) === 'true' ? 'done' : ''}" onclick="toggleExercise(this, '${id}')">
                    <div>
                        <div style="font-size:0.7rem; color:var(--accent)">${e.eq}</div>
                        <div style="font-size:1.1rem; font-weight:bold">${e.n}</div>
                        <div style="color:#666; font-size:0.9rem">${e.s}</div>
                    </div>
                    <button class="btn-rest" onclick="event.stopPropagation(); restTimer()">60s</button>
                </div>`;
            });
            updateProgress();
        }

        function changeDay(o) { currentDay += o; if(currentDay < 1) currentDay = 5; if(currentDay > 5) currentDay = 1; render(); }
        
        // Registro de Service Worker para modo offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(new Blob([`
                self.addEventListener('install', e => e.waitUntil(caches.open('boyka-gym-v1').then(c => c.addAll(['./index.html']))));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
            `], {type: 'text/javascript'}));
        }
        render();
    </script>
</body>
</html>
